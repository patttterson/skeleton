<!doctype html>
<html>
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>skeleton</title>
		<style>
			@font-face { font-family: Papyrus; src: url(papyrus.woff2) format("woff2"); font-display: block; }
			body { margin: 0; height: 100vh; display: grid; place-content: center; justify-items: center; gap: 2rem; background: #222; }
			h1 { margin: 0; color: white; font: 6rem Papyrus, fantasy; text-align: center; cursor: pointer; user-select: none; }
			form { display: grid; grid-template-columns: auto auto 4ch; gap: 0.5rem 1rem; align-items: center; color: white; font: 1.5rem Papyrus, fantasy; }
			label { display: contents; }
			input { width: min(16rem, 40vw); }
		</style>
		<script type="module" src="skeleton.js" data-chance="0"></script>
	</head>
	<body>
		<h1 onclick="runSkeleton()">skeleton</h1>
		<form>
			<label>
				chance per second
				<input name="chance" type="range" min="0" max="100" value="0" data-scale="0.01" data-unit="%" autocomplete="off" />
				<span>0%</span>
			</label>
			<label>
				fps
				<input name="fps" type="range" min="5" max="120" value="40" autocomplete="off" />
				<span>40</span>
			</label>
			<label>
				size
				<input name="size" type="range" min="5" max="60" value="15" data-unit="%" autocomplete="off" />
				<span>15%</span>
			</label>
		</form>
		<script>
			const skel = document.querySelector('script[src$="skeleton.js"]');
			document.querySelector('form').oninput = ({ target: t }) => {
				skel.dataset[t.name] = t.value * (t.dataset.scale ?? 1);
				t.nextElementSibling.textContent = t.value + (t.dataset.unit ?? '');
			};
		</script>
	</body>
</html>
